<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 915 412" width="915" height="412">
  <defs>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;display=swap');
      .giant-num { font-family: 'Bebas Neue', sans-serif; font-size: 260px; font-weight: 900; }
      .sub-date { font-family: monospace; font-size: 16px; font-weight: 700; letter-spacing: 6px; }
    </style>
  </defs>

  <!-- Deep OLED Black Canvas -->
  <rect width="915" height="412" fill="#000000" />

  <!-- Pure Fullscreen Giant Digits (Centered, Edge-to-Edge) -->
  <g id="pure-clock" transform="translate(457.5, 275)" text-anchor="middle">
    <!-- Neon Glow Layer -->
    <text x="0" y="0" fill="#00F0FF" class="giant-num" letter-spacing="4" filter="url(#neon-glow)">
      10:45<tspan fill="#FF0055" font-size="110" dy="-90">:32</tspan>
    </text>

    <!-- Day % Horizon Line -->
    <rect x="-350" y="55" width="700" height="3" fill="#1A1A24" />
    <rect x="-350" y="55" width="315" height="3" fill="#00F0FF" />

    <text x="0" y="85" fill="#58A6FF" class="sub-date">
      WEDNESDAY • OCT 21, 2026
    </text>
  </g>
</svg>