<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 412 915" width="412" height="915">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;500;700;800&amp;display=swap');
      .mono-heavy { font-family: 'JetBrains Mono', monospace; font-weight: 800; }
      .mono-med { font-family: 'JetBrains Mono', monospace; font-weight: 500; }
      .mono-light { font-family: 'JetBrains Mono', monospace; font-weight: 300; }
    </style>
  </defs>

  <!-- Screen Frame: OLED Pure Black -->
  <rect width="412" height="915" fill="#000000" />

  <!-- Top Bar -->
  <g id="status-bar" opacity="0.6">
    <text x="32" y="38" fill="#FFFFFF" class="mono-med" font-size="12" letter-spacing="1">CHRONOCRAFT</text>
    <text x="380" y="38" fill="#00FF66" class="mono-heavy" font-size="11" text-anchor="end">● TIMER</text>
  </g>

  <line x1="24" y1="56" x2="388" y2="56" stroke="#222222" stroke-width="1" />
  <line x1="24" y1="810" x2="388" y2="810" stroke="#222222" stroke-width="1" />

  <!-- Sub-Mode Selector (TIMER vs STOPWATCH) -->
  <g id="sub-mode-selector" transform="translate(24, 85)">
    <rect width="180" height="40" fill="#141414" stroke="#00FF66" stroke-width="1" />
    <text x="90" y="25" fill="#00FF66" class="mono-heavy" font-size="11" text-anchor="middle" letter-spacing="1">COUNTDOWN TIMER</text>

    <rect x="184" y="0" width="180" height="40" fill="#0A0A0A" stroke="#222222" stroke-width="1" />
    <text x="274" y="25" fill="#666666" class="mono-med" font-size="11" text-anchor="middle" letter-spacing="1">STOPWATCH</text>
  </g>

  <!-- Large Focus Timer Box (Sharp Square Perimeter with Progress Highlight) -->
  <g id="timer-display" transform="translate(24, 155)">
    <!-- Outer Track -->
    <rect width="364" height="340" fill="#050505" stroke="#1A1A1A" stroke-width="6" />
    
    <!-- Active Progress Stroke (Top and Right borders active) -->
    <path d="M 0 0 L 364 0 L 364 255" fill="none" stroke="#00FF66" stroke-width="6" />

    <!-- Active Routine Name -->
    <text x="182" y="60" fill="#666666" class="mono-med" font-size="12" text-anchor="middle" letter-spacing="2">
      DEEP FOCUS SESSION #3
    </text>

    <!-- Remaining Time -->
    <text x="182" y="195" fill="#FFFFFF" class="mono-heavy" font-size="82" text-anchor="middle" letter-spacing="-3">
      21:40
    </text>

    <!-- Sub-fraction / Lap info -->
    <text x="182" y="240" fill="#00FF66" class="mono-med" font-size="16" text-anchor="middle">
      78% REMAINING  •  25 MIN TOTAL
    </text>

    <!-- Mini Progress Bars Inside -->
    <g transform="translate(62, 280)">
      <rect x="0" y="0" width="40" height="6" fill="#00FF66" />
      <rect x="50" y="0" width="40" height="6" fill="#00FF66" />
      <rect x="100" y="0" width="40" height="6" fill="#00FF66" />
      <rect x="150" y="0" width="40" height="6" fill="#222222" />
      <rect x="200" y="0" width="40" height="6" fill="#222222" />
    </g>
  </g>

  <!-- Preset Quick Focus Chips -->
  <g id="timer-presets" transform="translate(24, 525)">
    <text x="0" y="0" fill="#666666" class="mono-med" font-size="10" letter-spacing="1">QUICK FOCUS PRESETS</text>
    
    <g transform="translate(0, 15)">
      <!-- Preset 1: Pomodoro -->
      <rect width="85" height="42" fill="#111111" stroke="#00FF66" stroke-width="1" />
      <text x="42" y="26" fill="#00FF66" class="mono-heavy" font-size="12" text-anchor="middle">25 MIN</text>

      <!-- Preset 2: Short Break -->
      <rect x="93" y="0" width="85" height="42" fill="#0A0A0A" stroke="#222222" stroke-width="1" />
      <text x="135" y="26" fill="#888888" class="mono-med" font-size="12" text-anchor="middle">5 MIN</text>

      <!-- Preset 3: Deep Work -->
      <rect x="186" y="0" width="85" height="42" fill="#0A0A0A" stroke="#222222" stroke-width="1" />
      <text x="228" y="26" fill="#888888" class="mono-med" font-size="12" text-anchor="middle">45 MIN</text>

      <!-- Preset 4: Power Nap -->
      <rect x="279" y="0" width="85" height="42" fill="#0A0A0A" stroke="#222222" stroke-width="1" />
      <text x="321" y="26" fill="#888888" class="mono-med" font-size="12" text-anchor="middle">20 MIN</text>
    </g>
  </g>

  <!-- Massive Tactile Controls (Sharp Brutalist Buttons) -->
  <g id="timer-controls" transform="translate(24, 615)">
    <!-- Primary Action: PAUSE / RESUME -->
    <rect width="240" height="70" fill="#00FF66" />
    <text x="120" y="44" fill="#000000" class="mono-heavy" font-size="18" text-anchor="middle" letter-spacing="2">
      ❚❚  PAUSE
    </text>

    <!-- Secondary Action: RESET -->
    <rect x="250" y="0" width="114" height="70" fill="#111111" stroke="#333333" stroke-width="1" />
    <text x="307" y="44" fill="#FFFFFF" class="mono-heavy" font-size="14" text-anchor="middle" letter-spacing="1">
      RESET
    </text>

    <!-- Sound & Haptics toggle row -->
    <g transform="translate(0, 95)">
      <rect width="177" height="38" fill="#0A0A0A" stroke="#222222" stroke-width="1" />
      <text x="88" y="24" fill="#AAAAAA" class="mono-med" font-size="10" text-anchor="middle">🔔 BELL SOUND: ON</text>

      <rect x="187" y="0" width="177" height="38" fill="#0A0A0A" stroke="#222222" stroke-width="1" />
      <text x="275" y="24" fill="#AAAAAA" class="mono-med" font-size="10" text-anchor="middle">📳 HAPTIC: HEAVY</text>
    </g>
  </g>

  <!-- Bottom Mode Switcher Pill -->
  <g id="mode-nav-bar" transform="translate(24, 830)">
    <rect width="364" height="54" fill="#080808" stroke="#333333" stroke-width="1" />
    
    <!-- Inactive: CLOCK -->
    <text x="62" y="32" fill="#888888" class="mono-heavy" font-size="12" text-anchor="middle" letter-spacing="1">
      CLOCK
    </text>

    <!-- Inactive: COUNTDOWN -->
    <text x="182" y="32" fill="#888888" class="mono-heavy" font-size="12" text-anchor="middle" letter-spacing="1">
      COUNTDOWN
    </text>

    <!-- Active Pill: TIMER -->
    <rect x="244" y="4" width="116" height="46" fill="#00FF66" />
    <text x="302" y="32" fill="#000000" class="mono-heavy" font-size="12" text-anchor="middle" letter-spacing="1">
      TIMER
    </text>
  </g>
</svg>
