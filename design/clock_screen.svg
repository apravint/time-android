<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 412 915" width="412" height="915">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;500;700;800&amp;display=swap');
      .mono-heavy { font-family: 'JetBrains Mono', monospace; font-weight: 800; }
      .mono-med { font-family: 'JetBrains Mono', monospace; font-weight: 500; }
      .mono-light { font-family: 'JetBrains Mono', monospace; font-weight: 300; }
    </style>
  </defs>

  <!-- Screen Frame: OLED Pure Black -->
  <rect width="412" height="915" fill="#000000" />

  <!-- Top Status Bar Simulation -->
  <g id="status-bar" opacity="0.6">
    <text x="32" y="38" fill="#FFFFFF" class="mono-med" font-size="12" letter-spacing="1">CHRONOCRAFT</text>
    <text x="380" y="38" fill="#00FF66" class="mono-heavy" font-size="11" text-anchor="end">● FULLSCREEN</text>
  </g>

  <!-- Sharp Brutalist Decorative Grid Lines -->
  <line x1="24" y1="56" x2="388" y2="56" stroke="#222222" stroke-width="1" />
  <line x1="24" y1="810" x2="388" y2="810" stroke="#222222" stroke-width="1" />

  <!-- Date & Region Badge -->
  <g id="date-badge" transform="translate(24, 180)">
    <rect width="364" height="42" fill="#0A0A0A" stroke="#333333" stroke-width="1" />
    <text x="182" y="26" fill="#888888" class="mono-med" font-size="13" text-anchor="middle" letter-spacing="2">
      WEDNESDAY  •  OCT 21, 2026
    </text>
  </g>

  <!-- Main Clock Display (Sharp Monospace Digital) -->
  <g id="clock-display" transform="translate(24, 250)">
    <!-- Clock Outer Frame -->
    <rect width="364" height="260" fill="#050505" stroke="#00E5FF" stroke-width="2" />
    
    <!-- Time: Hours & Minutes -->
    <text x="182" y="130" fill="#FFFFFF" class="mono-heavy" font-size="92" text-anchor="middle" letter-spacing="-2">
      08:16
    </text>

    <!-- Seconds & Meridiē Badge -->
    <g transform="translate(182, 195)">
      <rect x="-80" y="-22" width="160" height="36" fill="#111111" stroke="#333333" stroke-width="1" />
      <text x="0" y="2" fill="#00E5FF" class="mono-heavy" font-size="20" text-anchor="middle" letter-spacing="3">
        : 45 <tspan fill="#888888" font-size="14">AM</tspan>
      </text>
    </g>

    <!-- Sub-info: Timezone & Day Progress -->
    <text x="182" y="240" fill="#555555" class="mono-light" font-size="11" text-anchor="middle" letter-spacing="1">
      LOCAL TIME  (UTC+05:30)  •  WEEK 43
    </text>
  </g>

  <!-- Ambient Quick Stats Cards (Sharp Rectangles) -->
  <g id="ambient-stats" transform="translate(24, 535)">
    <!-- Card 1: Day Progress -->
    <g transform="translate(0, 0)">
      <rect width="174" height="74" fill="#0A0A0A" stroke="#222222" stroke-width="1" />
      <text x="16" y="26" fill="#666666" class="mono-med" font-size="10" letter-spacing="1">DAY ELAPSED</text>
      <text x="16" y="52" fill="#FFFFFF" class="mono-heavy" font-size="20">34.5%</text>
      <!-- Mini Progress bar -->
      <rect x="16" y="62" width="142" height="3" fill="#222222" />
      <rect x="16" y="62" width="49" height="3" fill="#00E5FF" />
    </g>

    <!-- Card 2: Next Event -->
    <g transform="translate(190, 0)">
      <rect width="174" height="74" fill="#0A0A0A" stroke="#222222" stroke-width="1" />
      <text x="16" y="26" fill="#666666" class="mono-med" font-size="10" letter-spacing="1">NEXT TARGET</text>
      <text x="16" y="52" fill="#00FF66" class="mono-heavy" font-size="16">01:43:15</text>
      <text x="16" y="65" fill="#444444" class="mono-light" font-size="9">Standup Meeting</text>
    </g>
  </g>

  <!-- Quick Action Toggles (Seconds toggle, 24h toggle, Ambient toggle) -->
  <g id="clock-toggles" transform="translate(24, 630)">
    <rect width="114" height="40" fill="#111111" stroke="#333333" stroke-width="1" />
    <text x="57" y="25" fill="#AAAAAA" class="mono-med" font-size="11" text-anchor="middle">24-HOUR</text>

    <rect x="125" y="0" width="114" height="40" fill="#111111" stroke="#00E5FF" stroke-width="1" />
    <text x="182" y="25" fill="#00E5FF" class="mono-med" font-size="11" text-anchor="middle">SECONDS</text>

    <rect x="250" y="0" width="114" height="40" fill="#111111" stroke="#333333" stroke-width="1" />
    <text x="307" y="25" fill="#AAAAAA" class="mono-med" font-size="11" text-anchor="middle">OLED DIM</text>
  </g>

  <!-- Bottom Mode Switcher Pill (Sharp Brutalist Navigation) -->
  <g id="mode-nav-bar" transform="translate(24, 830)">
    <rect width="364" height="54" fill="#080808" stroke="#333333" stroke-width="1" />
    
    <!-- Active Pill: CLOCK -->
    <rect x="4" y="4" width="116" height="46" fill="#FFFFFF" />
    <text x="62" y="32" fill="#000000" class="mono-heavy" font-size="12" text-anchor="middle" letter-spacing="1">
      CLOCK
    </text>

    <!-- Inactive: COUNTDOWN -->
    <text x="182" y="32" fill="#888888" class="mono-heavy" font-size="12" text-anchor="middle" letter-spacing="1">
      COUNTDOWN
    </text>

    <!-- Inactive: TIMER -->
    <text x="302" y="32" fill="#888888" class="mono-heavy" font-size="12" text-anchor="middle" letter-spacing="1">
      TIMER
    </text>
  </g>
</svg>
